<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Game Lounge</title>
    <!-- Connects the visual styles you just made -->
    <link rel="stylesheet" href="style.css">
    <!-- Connects the game engine behavior script -->
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Tambola Game Lounge</h1>
    
    <!-- Big Bold Display Board for Called Numbers -->
    <div id="current-number">--</div>
    
    <!-- Number Drawing Control Button -->
    <button onclick="drawNextNumber()">Draw Next Number</button>

    <h2>Game Board (1 - 90)</h2>
    <!-- The grid matrix where numbers light up green -->
    <div id="board" class="board-grid"></div>

    <h2>Your Game Ticket</h2>
    <!-- The 3x9 grid matrix where your playable ticket generates -->
    <div id="ticket" class="ticket-grid"></div>

</body>
</html>
