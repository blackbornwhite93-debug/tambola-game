<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartTambola Enterprise System</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --accent-gold: #eab308;
            --success-green: #22c55e;
            --danger-red: #ef4444;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 10px; font-size: 14px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 12px 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .logo { font-weight: 800; color: var(--accent-gold); font-size: 18px; text-transform: uppercase; }
        .role-badge { background: #1e293b; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid #334155; }
        
        .auth-screen { background: var(--panel-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); max-width: 480px; margin: 30px auto; text-align: center; }
        .auth-screen h2 { color: var(--accent-gold); margin-top: 0; }
        .input-field { width: 100%; padding: 15px; margin: 10px 0; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 900px; margin: auto; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); }
        .card-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        #big-display { font-size: 80px; font-weight: 900; color: var(--accent-gold); line-height: 1; text-shadow: 0 0 20px rgba(234,179,8,0.3); margin: 10px 0; }
        .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .btn { background: var(--accent-gold); color: #000; border: none; padding: 14px 20px; font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer; flex: 1; }
        .btn-secondary { background: #374151; color: white; }
        
        .board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #1f2937; border-radius: 4px; font-weight: 700; color: #4b5563; font-size: 12px; }
        .cell.called { background: var(--success-green); color: #000; font-size: 13px; box-shadow: 0 0 8px rgba(34,197,94,0.4); }
        
        .agent-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #1f2937; padding: 10px; border-radius: 6px; text-align: center; }
        .stat-val { font-size: 18px; font-weight: 700; color: var(--success-green); }
        
        .ticket-box { background: white; padding: 8px; border-radius: 6px; margin-top: 10px; }
        .ticket-table { border-collapse: collapse; width: 100%; }
        .ticket-table td { border: 2px solid #cbd5e1; width: 11.11%; height: 38px; text-align: center; font-size: 16px; font-weight: 700; color: #0f172a; }
        .ticket-table td.blank { background: #f1f5f9; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="logo">StartTambola Panel</div>
        <div class="role-badge" id="current-role">Guest Profile</div>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-panel" class="auth-screen">
        <h2>System Login Portal</h2>
        <input type="password" id="pass-input" class="input-field" placeholder="Enter System Security Pin" inputmode="numeric">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" type="button" onclick="verifyLogin('admin')">Login as Admin</button>
            <button class="btn btn-secondary" type="button" onclick="verifyLogin('agent')">Login as Agent</button>
        </div>
        <button class="btn btn-secondary" type="button" style="margin-top: 12px; width: 100%; background: transparent; border: 1px solid #4b5563;" onclick="enterGuest()">View Live Board Only</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="main-app" class="grid-layout" style="display: none;">
        
        <!-- ADMIN HOST PANEL -->
        <div id="admin-panel" class="card" style="display: none;">
            <div class="card-title">Live Calling Deck (Admin Only)</div>
            <center>
                <div id="big-display">--</div>
            </center>
            <div class="btn-group">
                <button class="btn" onclick="drawNextNumber()">Call Next Value</button>
                <button class="btn btn-secondary" style="color: var(--danger-red);" onclick="clearFullGame()">Reset Sheet</button>
            </div>
        </div>

        <!-- AGENT PANEL -->
        <div id="agent-panel" class="card" style="display: none;">
            <div class="card-title">Agent Ledger & Allocations</div>
            <div class="agent-stats">
                <div class="stat-box"><div>Wallet Balance</div><div class="stat-val" id="agent-balance">5,000 pts</div></div>
                <div class="stat-box"><div>Issued Tickets</div><div class="stat-val" id="agent-count" style="color:var(--accent-gold);">0</div></div>
            </div>
            <input type="text" id="player-name" class="input-field" placeholder="Customer / Player Name" style="margin-top:0;">
            <button class="btn" style="width: 100%;" onclick="issueTicketToPlayer()">Generate & Sell Ticket (-100 pts)</button>
            <div id="agent-ticket-output"></div>
        </div>

        <!-- SHARED LIVE NUMBER BOARD -->
        <div class="card">
            <div class="card-title">Live Game Grid Sheet (1-90)</div>
            <div class="board" id="main-grid"></div>
        </div>

    </div>

    <script>
        let sessionRole = 'guest';
        let gameNumbers = [];
        let walletPoints = 5000;
        let ticketsIssuedCount = 0;

        function buildGridSystem() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 90; i++) {
                let node = document.createElement('div');
                node.className = 'cell';
                node.id = 'num-' + i;
                node.innerText = i;
                grid.appendChild(node);
            }
        }

        function verifyLogin(role) {
            const pin = document.getElementById('pass-input').value.trim();
            
            if (role === 'admin') {
                if (pin === '1234') {
                    sessionRole = 'admin';
                    launchApp();
                } else {
                    alert("Incorrect Admin PIN! Use 1234");
                }
            } else if (role === 'agent') {
                if (pin === '5678') {
                    sessionRole = 'agent';
                    launchApp();
                } else {
                    alert("Incorrect Agent PIN! Use 5678");
                }
            }
        }

        function enterGuest() {
            sessionRole = 'guest';
            launchApp();
        }

        function launchApp() {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('main-app').style.display = 'grid';
            document.getElementById('current-role').innerText = sessionRole.toUpperCase() + " PROFILE";
            
            if(sessionRole === 'admin') document.getElementById('admin-panel').style.display = 'block';
            if(sessionRole === 'agent') document.getElementById('agent-panel').style.display = 'block';
            buildGridSystem();
        }

        function drawNextNumber() {
            if (gameNumbers.length >= 90) return;
            let currentDraw;
            do {
                currentDraw = Math.floor(Math.random() * 90) + 1;
            } while (gameNumbers.includes(currentDraw));

            gameNumbers.push(currentDraw);
            document.getElementById('big-display').innerText = currentDraw;
            document.getElementById('num-' + currentDraw).classList.add('called');
            
            window.speechSynthesis.cancel();
            let voiceAnnouncement = new SpeechSynthesisUtterance("Number " + currentDraw);
            window.speechSynthesis.speak(voiceAnnouncement);
        }

        function clearFullGame() {
            if(confirm("Are you sure you want to completely flush the active game dashboard?")) {
                gameNumbers = [];
                document.getElementById('big-display').innerText = '--';
                buildGridSystem();
                document.getElementById('agent-ticket-output').innerHTML = '';
            }
        }

        function issueTicketToPlayer() {
            const name = document.getElementById('player-name').value.trim();
            if(!name) { alert("Please input customer name first!"); return; }
            if(walletPoints < 100) { alert("Insufficient agent wallet balances!"); return; }
            
            walletPoints -= 100;
            ticketsIssuedCount++;
            document.getElementById('agent-balance').innerText = walletPoints.toLocaleString() + " pts";
            document.getElementById('agent-count').innerText = ticketsIssuedCount;

            let matrix = Array.from({ length: 3 }, () => Array(9).fill(0));
            for (let c = 0; c < 9; c++) {
                let min = c * 10 + 1; let max = c * 10 + 10; if (c === 8) max = 90;
                let subset = [];
